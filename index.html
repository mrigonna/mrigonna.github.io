<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>für dich 🌸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Crimson+Pro:wght@300;400&display=swap');

  :root {
    --bg: #07000a;
    --pink:  #f472b6;
    --pink2: #ec4899;
    --pink3: #be185d;
    --rose:  #fda4af;
    --cream: #fce7f3;
    --teal:  #2dd4bf;
    --green: #16a34a;
    --green2:#15803d;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Crimson Pro', serif;
  }

  /* Stars */
  .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star {
    position:absolute; border-radius:50%; background:white;
    animation: twinkle var(--d) ease-in-out infinite alternate;
    opacity:0;
  }
  @keyframes twinkle {
    0%   { opacity:0; transform:scale(0.5); }
    100% { opacity:var(--op); transform:scale(1); }
  }

  /* Ambient glow */
  .ambient {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse 80% 50% at 50% 100%, rgba(236,72,153,0.13) 0%, transparent 70%);
    opacity:0; transition: opacity 2.5s ease;
  }
  .ambient.show { opacity:1; }

  /* Button */
  #start-btn {
    position:relative; z-index:10;
    padding:18px 52px;
    background:transparent;
    border:1.5px solid rgba(244,114,182,0.55);
    color:#fff;
    font-family:'Cormorant Garamond', serif;
    font-size:1.25rem;
    font-style:italic;
    letter-spacing:0.1em;
    cursor:pointer;
    border-radius:50px;
    transition:all 0.3s ease;
    box-shadow: 0 0 22px rgba(244,114,182,0.2), inset 0 0 18px rgba(244,114,182,0.04);
    animation: pulse-btn 2.8s ease-in-out infinite;
  }
  #start-btn:hover {
    background:rgba(244,114,182,0.09);
    box-shadow:0 0 45px rgba(244,114,182,0.5), inset 0 0 28px rgba(244,114,182,0.1);
    border-color:rgba(244,114,182,0.9);
    transform:scale(1.06);
  }
  @keyframes pulse-btn {
    0%,100% { box-shadow:0 0 22px rgba(244,114,182,0.2), inset 0 0 18px rgba(244,114,182,0.04); }
    50%      { box-shadow:0 0 38px rgba(244,114,182,0.4), inset 0 0 24px rgba(244,114,182,0.09); }
  }
  #start-btn.hide { animation: btn-out 0.65s ease forwards; }
  @keyframes btn-out {
    0%   { opacity:1; transform:scale(1); }
    50%  { opacity:0; transform:scale(1.25); }
    100% { opacity:0; transform:scale(0); pointer-events:none; }
  }

  /* Scene */
  #scene {
    position:fixed; inset:0;
    display:flex; align-items:flex-end; justify-content:center;
    pointer-events:none; z-index:5;
  }
  .ground {
    position:absolute; bottom:0; left:0; right:0; height:90px;
    background:linear-gradient(to top, #050005, transparent); z-index:1;
  }
  #garden {
    position:absolute; bottom:0; width:100%; max-width:960px; height:78vh;
  }

  /* Message card */
  #message-card {
    position:fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease, transform 1s cubic-bezier(0.34,1.3,0.64,1);
    text-align: center;
    max-width: 460px;
    width: 90%;
  }
  #message-card.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }
  .msg-inner {
    background: rgba(10,0,12,0.75);
    border: 1px solid rgba(244,114,182,0.22);
    border-radius: 24px;
    padding: 38px 40px 32px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px rgba(244,114,182,0.14), 0 0 120px rgba(244,114,182,0.05);
    position: relative;
    overflow: hidden;
  }
  .msg-inner::before {
    content:'';
    position:absolute; inset:-1px;
    border-radius:24px;
    background: linear-gradient(135deg, rgba(244,114,182,0.28), transparent 40%, rgba(45,212,191,0.12));
    pointer-events:none;
  }
  .msg-icon {
    font-size: 2.2rem;
    margin-bottom: 16px;
    display:block;
    animation: icon-float 3s ease-in-out infinite alternate;
  }
  @keyframes icon-float {
    0%   { transform:translateY(0) rotate(-4deg); }
    100% { transform:translateY(-9px) rotate(4deg); }
  }
  .msg-line {
    display:block;
    font-family:'Cormorant Garamond', serif;
    color: #fce7f3;
    margin-bottom:10px;
    opacity:0;
    transform:translateY(12px);
    transition: opacity 0.75s ease, transform 0.75s ease;
  }
  .msg-line.show { opacity:1; transform:translateY(0); }
  .msg-line.big {
    font-size: 1.5rem;
    font-style: italic;
    font-weight:300;
    letter-spacing:0.04em;
    color: #fda4af;
    text-shadow: 0 0 22px rgba(244,114,182,0.6);
  }
  .msg-line.medium {
    font-size: 1.13rem;
    font-weight:300;
    color: #f9a8d4;
    letter-spacing:0.02em;
  }
  .msg-line.love {
    font-size: 1.9rem;
    font-style: italic;
    color: #ec4899;
    text-shadow: 0 0 30px rgba(236,72,153,0.85), 0 0 60px rgba(236,72,153,0.3);
    margin-top: 8px;
  }
  .msg-divider {
    width:60px; height:1px;
    background: linear-gradient(to right, transparent, rgba(244,114,182,0.5), transparent);
    margin: 14px auto;
    opacity:0; transition: opacity 0.7s ease;
  }
  .msg-divider.show { opacity:1; }
  .close-btn {
    margin-top:22px;
    background:transparent;
    border:1px solid rgba(244,114,182,0.35);
    color:rgba(252,231,243,0.55);
    font-family:'Crimson Pro', serif;
    font-size:0.82rem;
    padding:7px 22px;
    border-radius:20px;
    cursor:pointer;
    pointer-events:auto;
    letter-spacing:0.06em;
    transition:all 0.3s;
  }
  .close-btn:hover { color:#fce7f3; border-color:rgba(244,114,182,0.8); }

  /* Floating labels */
  .label {
    position:absolute;
    background:rgba(120,20,60,0.82);
    color:#fce7f3;
    font-family:'Crimson Pro', serif;
    font-size:0.82rem;
    padding:7px 16px;
    border-radius:20px;
    white-space:nowrap;
    opacity:0;
    box-shadow:0 0 16px rgba(236,72,153,0.45);
    pointer-events:none;
    letter-spacing:0.03em;
    backdrop-filter:blur(4px);
  }

  /* Particles */
  .particle {
    position:absolute; border-radius:50%; pointer-events:none;
    animation: float-p var(--dur) ease-in-out infinite alternate;
    opacity:0;
  }
  @keyframes float-p {
    0%   { transform:translateY(0) scale(1);   opacity:var(--op); }
    100% { transform:translateY(-22px) scale(1.4); opacity:calc(var(--op)*0.3); }
  }

  /* Falling petals */
  .petal-fall {
    position:fixed; pointer-events:none; z-index:3;
    font-size:1rem;
    animation: petal-drop var(--fdur) linear infinite;
    opacity:0;
  }
  @keyframes petal-drop {
    0%   { transform:translateY(-30px) rotate(0deg) scale(var(--fs));  opacity:0; }
    10%  { opacity:0.65; }
    90%  { opacity:0.35; }
    100% { transform:translateY(110vh) rotate(720deg) scale(var(--fs)); opacity:0; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="ambient" id="ambient"></div>

<button id="start-btn">für dich 🌸</button>

<div id="scene">
  <div class="ground"></div>
  <svg id="garden" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet"></svg>
</div>

<!-- Corner labels -->
<div class="label" id="l1" style="top:16%;left:5%">du schaffst das ✨</div>
<div class="label" id="l2" style="top:44%;left:2%">ich glaube an dich 🤍</div>
<div class="label" id="l3" style="top:18%;right:4%">viel Erfolg bei den Prüfungen</div>
<div class="label" id="l4" style="top:50%;right:3%">ich liebe dich ♥</div>

<!-- Message card -->
<div id="message-card">
  <div class="msg-inner">
    <span class="msg-icon">🌸</span>
    <span class="msg-line big" id="m1">Viel Erfolg für deine Prüfungen</span>
    <div class="msg-divider" id="md1"></div>
    <span class="msg-line medium" id="m2">Du schaffst das.</span>
    <span class="msg-line medium" id="m3">Ich glaube an dich — wirklich.</span>
    <div class="msg-divider" id="md2"></div>
    <span class="msg-line love" id="m4">Ich liebe dich ♥</span>
    <button class="close-btn" id="close-btn">schließen</button>
  </div>
</div>

<script>
// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 130; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.4;
  s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*3+1.5).toFixed(1)}s;--op:${(Math.random()*0.65+0.1).toFixed(2)};animation-delay:${(Math.random()*5).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

// SVG helpers
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('garden');
function el(tag, a={}) {
  const e = document.createElementNS(NS, tag);
  for(const [k,v] of Object.entries(a)) e.setAttribute(k,v);
  return e;
}

function addDefs() {
  const defs = el('defs');

  // Glow filters
  [
    {id:'glow-pink',  col:'#f472b6', dev:9},
    {id:'glow-rose',  col:'#fda4af', dev:7},
    {id:'glow-deep',  col:'#be185d', dev:12},
    {id:'glow-teal',  col:'#2dd4bf', dev:7},
    {id:'glow-green', col:'#22c55e', dev:5},
    {id:'glow-gold',  col:'#fbbf24', dev:8},
  ].forEach(({id,col,dev}) => {
    const f = el('filter',{id,x:'-60%',y:'-60%',width:'220%',height:'220%'});
    const b = el('feGaussianBlur',{in:'SourceGraphic',stdDeviation:dev,result:'blur'});
    const fl= el('feFlood',{'flood-color':col,'flood-opacity':'0.85',result:'c'});
    const co= el('feComposite',{in:'c',in2:'blur',operator:'in',result:'g'});
    const m = el('feMerge');
    m.appendChild(el('feMergeNode',{in:'g'}));
    m.appendChild(el('feMergeNode',{in:'SourceGraphic'}));
    [b,fl,co,m].forEach(n=>f.appendChild(n));
    defs.appendChild(f);
  });

  // Radial gradients
  const rad = (id,c1,c2,c3) => {
    const g = el('radialGradient',{id,cx:'50%',cy:'40%',r:'65%'});
    [[0,c1],[50,c2],[100,c3]].forEach(([off,col])=>{
      g.appendChild(el('stop',{offset:`${off}%`,'stop-color':col}));
    });
    defs.appendChild(g);
  };
  rad('pg-outer','#fce7f3','#f9a8d4','#ec4899');
  rad('pg-mid',  '#fda4af','#f472b6','#db2777');
  rad('pg-inner','#fbcfe8','#f9a8d4','#f472b6');
  rad('pg-center','#fff7ed','#fef08a','#fbbf24');
  rad('lg-teal', '#a5f3fc','#2dd4bf','#0891b2');
  rad('lg-green','#4ade80','#16a34a','#14532d');

  // Stem gradient
  const sg = el('linearGradient',{id:'stem-g',x1:'0',y1:'0',x2:'1',y2:'0'});
  [['0%','#15803d'],['50%','#4ade80'],['100%','#15803d']].forEach(([o,c])=>{
    sg.appendChild(el('stop',{offset:o,'stop-color':c}));
  });
  defs.appendChild(sg);

  svg.appendChild(defs);
}

// Peony with layered petals
function makePeony(cx, cy, outerR) {
  const g = el('g',{transform:`translate(${cx},${cy})`,opacity:'0'});

  // Layer 1: 6 large outer petals
  for(let i=0;i<6;i++){
    const ang = i*60;
    const pg = el('g',{transform:`rotate(${ang})`});
    const r = outerR;
    pg.appendChild(el('path',{
      d:`M0,0 C${-r*0.32},${-r*0.38} ${-r*0.28},${-r*0.92} 0,${-r} C${r*0.28},${-r*0.92} ${r*0.32},${-r*0.38} 0,0 Z`,
      fill:'url(#pg-outer)', filter:'url(#glow-pink)', opacity:'0.88',
    }));
    g.appendChild(pg);
  }
  // Layer 2: 6 mid petals rotated 30°
  for(let i=0;i<6;i++){
    const ang = i*60+30;
    const r2 = outerR*0.76;
    const pg = el('g',{transform:`rotate(${ang})`});
    pg.appendChild(el('path',{
      d:`M0,0 C${-r2*0.28},${-r2*0.36} ${-r2*0.22},${-r2*0.90} 0,${-r2} C${r2*0.22},${-r2*0.90} ${r2*0.28},${-r2*0.36} 0,0 Z`,
      fill:'url(#pg-mid)', filter:'url(#glow-pink)', opacity:'0.92',
    }));
    g.appendChild(pg);
  }
  // Layer 3: 7 inner petals
  for(let i=0;i<7;i++){
    const ang = i*(360/7)+8;
    const r3 = outerR*0.52;
    const pg = el('g',{transform:`rotate(${ang})`});
    pg.appendChild(el('path',{
      d:`M0,0 C${-r3*0.24},${-r3*0.34} ${-r3*0.18},${-r3*0.87} 0,${-r3} C${r3*0.18},${-r3*0.87} ${r3*0.24},${-r3*0.34} 0,0 Z`,
      fill:'url(#pg-inner)', filter:'url(#glow-rose)', opacity:'0.96',
    }));
    g.appendChild(pg);
  }
  // Layer 4: tiny ruffled inner petals
  for(let i=0;i<10;i++){
    const ang = i*36;
    const r4 = outerR*0.28;
    const pg = el('g',{transform:`rotate(${ang})`});
    pg.appendChild(el('ellipse',{cx:0,cy:-r4,rx:r4*0.26,ry:r4*0.42,fill:'url(#pg-inner)',opacity:'0.9'}));
    g.appendChild(pg);
  }
  // Center
  g.appendChild(el('circle',{cx:0,cy:0,r:outerR*0.18,fill:'url(#pg-center)',filter:'url(#glow-gold)',opacity:'0.95'}));
  for(let i=0;i<8;i++){
    const a=i*45, r5=outerR*0.22;
    g.appendChild(el('circle',{cx:Math.cos(a*Math.PI/180)*r5,cy:Math.sin(a*Math.PI/180)*r5,r:outerR*0.04,fill:'#fbbf24',opacity:'0.8'}));
  }
  return g;
}

function makeLeaf(x,y,angle,scl,grad,glow){
  const g = el('g',{transform:`translate(${x},${y}) rotate(${angle}) scale(${scl})`});
  const p = el('path',{d:'M0,0 C12,-22 36,-28 22,-6 C36,-22 28,12 0,0 Z',fill:grad,filter:glow,opacity:'0'});
  g.appendChild(p);
  return {g,path:p};
}

function makeStem(x,baseY,height,w){
  const g = el('g');
  const cx = x + (Math.random()-0.5)*18;
  const stem = el('path',{
    d:`M${x},${baseY} Q${cx},${baseY-height*0.5} ${x},${baseY-height}`,
    stroke:'url(#stem-g)','stroke-width':w,'stroke-linecap':'round',fill:'none',
    filter:'url(#glow-green)',
    'stroke-dasharray':height*1.5, 'stroke-dashoffset':height*1.5,
  });
  g.appendChild(stem);
  return {g,stem};
}

function makeGrass(x,baseY,h,lean,col){
  const g = el('g');
  const blade = el('path',{
    d:`M${x},${baseY} Q${x+lean},${baseY-h*0.55} ${x+lean*2},${baseY-h}`,
    stroke:col,'stroke-width':2.5,'stroke-linecap':'round',fill:'none',
    filter:'url(#glow-green)',
    'stroke-dasharray':h*1.3,'stroke-dashoffset':h*1.3,
  });
  g.appendChild(blade);
  return {g,blade};
}

function animDash(elem,delay,dur){
  setTimeout(()=>{
    elem.style.transition=`stroke-dashoffset ${dur}ms cubic-bezier(0.25,0.46,0.45,0.94)`;
    elem.setAttribute('stroke-dashoffset','0');
  },delay);
}

function springScale(gElem,delay,baseTf){
  setTimeout(()=>{
    gElem.setAttribute('opacity','1');
    let s=0.05, v=0;
    const tick=()=>{
      v+=(1-s)*0.15; v*=0.72; s+=v;
      gElem.setAttribute('transform',`${baseTf} scale(${s.toFixed(4)})`);
      if(Math.abs(1-s)>0.002||Math.abs(v)>0.001) requestAnimationFrame(tick);
      else gElem.setAttribute('transform',baseTf);
    };
    requestAnimationFrame(tick);
  },delay);
}

function fadeIn(elem,delay){
  setTimeout(()=>{
    elem.style.transition='opacity 0.75s ease';
    elem.setAttribute('opacity','1');
  },delay);
}

function buildGarden(){
  addDefs();
  const baseY=615;

  // Grass
  [
    [55,115,-18,'#15803d'],[78,98,10,'#166534'],
    [125,135,-12,'#15803d'],[152,85,14,'#14532d'],
    [710,105,12,'#15803d'],[738,122,-9,'#166534'],
    [805,92,16,'#15803d'],[828,108,-13,'#14532d'],
    [195,72,6,'#166534'],[660,78,-6,'#166534'],
    [435,68,9,'#15803d'],[462,83,-7,'#14532d'],
    [255,60,4,'#15803d'],[585,65,-4,'#166534'],
  ].forEach(([x,h,lean,col])=>{
    const {g,blade}=makeGrass(x,baseY,h,lean,col);
    svg.appendChild(g);
    animDash(blade,350+Math.random()*700,750);
  });

  // 5 peonies
  const plants=[
    {x:355,h:295,r:40,w:8,side:-1,lc:3,d:700},
    {x:435,h:330,r:46,w:9,side: 1,lc:3,d:850},
    {x:505,h:268,r:36,w:7,side:-1,lc:2,d:1000},
    {x:298,h:212,r:31,w:6,side: 1,lc:2,d:1100},
    {x:575,h:202,r:29,w:5,side:-1,lc:2,d:1150},
  ];

  plants.forEach(({x,h,r,w,side,lc,d})=>{
    const {g:sG,stem}=makeStem(x,baseY,h,w);
    svg.appendChild(sG);
    animDash(stem,d,650+h);

    for(let li=0;li<lc;li++){
      const {g:lG,path:lP}=makeLeaf(
        x+side*8, baseY-h*(0.3+li*0.28),
        side*(38+li*12), 1+li*0.08,
        'url(#lg-teal)','url(#glow-teal)'
      );
      svg.appendChild(lG);
      fadeIn(lP,d+500+li*220);
    }

    const flower=makePeony(x,baseY-h-2,r);
    svg.appendChild(flower);
    springScale(flower,d+950+h*0.4,`translate(${x},${baseY-h-2})`);
  });

  // Big decorative leaves
  [
    {x:242,y:baseY-128,ang:-32,s:2.6,gr:'url(#lg-teal)',gl:'url(#glow-teal)'},
    {x:272,y:baseY-84, ang:-55,s:2.3,gr:'url(#lg-teal)',gl:'url(#glow-teal)'},
    {x:602,y:baseY-108,ang: 32,s:2.5,gr:'url(#lg-teal)',gl:'url(#glow-teal)'},
    {x:570,y:baseY-70, ang: 52,s:2.1,gr:'url(#lg-teal)',gl:'url(#glow-teal)'},
    {x:385,y:baseY-64, ang:-22,s:2.0,gr:'url(#lg-green)',gl:'url(#glow-green)'},
    {x:460,y:baseY-54, ang: 26,s:2.0,gr:'url(#lg-green)',gl:'url(#glow-green)'},
    {x:322,y:baseY-50, ang:-40,s:1.7,gr:'url(#lg-green)',gl:'url(#glow-green)'},
    {x:532,y:baseY-47, ang: 42,s:1.8,gr:'url(#lg-green)',gl:'url(#glow-green)'},
  ].forEach(({x,y,ang,s,gr,gl},ti)=>{
    const {g:lG,path:lP}=makeLeaf(x,y,ang,s,gr,gl);
    svg.appendChild(lG);
    fadeIn(lP,1300+ti*160);
  });
}

function spawnFallingPetals(){
  ['🌸','✿','❀','🌺'].forEach((sym,i)=>{
    for(let j=0;j<5;j++){
      const p=document.createElement('div');
      p.className='petal-fall';
      const fs=0.5+Math.random()*0.9;
      p.textContent=sym;
      p.style.cssText=`left:${5+Math.random()*90}%;--fdur:${(7+Math.random()*9).toFixed(1)}s;--fs:${fs.toFixed(2)};animation-delay:${(Math.random()*12).toFixed(1)}s;`;
      document.body.appendChild(p);
    }
  });
}

function spawnParticles(){
  ['#f472b6','#fda4af','#2dd4bf','#4ade80','#fbbf24'].forEach(c=>{
    for(let i=0;i<6;i++){
      const p=document.createElement('div');
      p.className='particle';
      const sz=Math.random()*5+2;
      p.style.cssText=`width:${sz}px;height:${sz}px;background:${c};box-shadow:0 0 ${sz*3}px ${c};left:${15+Math.random()*70}%;top:${8+Math.random()*75}%;--dur:${(Math.random()*3+2).toFixed(1)}s;--op:${(Math.random()*0.55+0.15).toFixed(2)};animation-delay:${(Math.random()*3).toFixed(1)}s;`;
      document.body.appendChild(p);
    }
  });
}

function showLabels(){
  [{id:'l1',d:2400},{id:'l3',d:2900},{id:'l2',d:3400},{id:'l4',d:3900}].forEach(({id,d})=>{
    setTimeout(()=>{
      const e=document.getElementById(id);
      e.style.transition='opacity 0.9s ease, transform 0.9s cubic-bezier(0.34,1.4,0.64,1)';
      e.style.transform='translateY(10px)'; e.style.opacity='0';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        e.style.opacity='1'; e.style.transform='translateY(0)';
      }));
    },d);
  });
}

function showMessageCard(){
  const card=document.getElementById('message-card');
  card.classList.add('show');
  [
    {id:'m1',d:200},
    {id:'md1',d:650},
    {id:'m2',d:880},
    {id:'m3',d:1280},
    {id:'md2',d:1680},
    {id:'m4',d:1980},
  ].forEach(({id,d})=>{
    setTimeout(()=>document.getElementById(id).classList.add('show'),d);
  });
}

document.getElementById('close-btn').addEventListener('click',()=>{
  const card=document.getElementById('message-card');
  card.style.transition='opacity 0.6s ease, transform 0.6s ease';
  card.style.opacity='0'; card.style.transform='translate(-50%,-50%) scale(0.9)';
  setTimeout(()=>{ card.style.display='none'; },620);
});

document.getElementById('start-btn').addEventListener('click',function(){
  this.classList.add('hide');
  setTimeout(()=>{
    document.getElementById('ambient').classList.add('show');
    spawnParticles();
    spawnFallingPetals();
    buildGarden();
    showLabels();
    setTimeout(showMessageCard, 4300);
  },450);
});
</script>
</body>
</html>
